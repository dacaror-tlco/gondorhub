version: "3"
services:
    metube:
        image: ghcr.io/alexta69/metube:latest
        container_name: metube
        restart: unless-stopped
        ports:
            - "8081:8081"
        volumes:
            - /mnt/hdd/samba/metube:/downloads
        environment:
            PUID: 1000
            PGID: 1000
