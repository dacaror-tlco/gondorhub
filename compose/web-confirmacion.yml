# Web de Confirmación (+ sección Juniors con contraseña)
# ------------------------------------------------------------------
# Despliegue como STACK en Portainer (o `docker compose up -d` en la Pi).
#
# Preparación en la Pi (una vez), en /mnt/hdd/webs/web-confirmacion:
#   cp includes/config.example.php includes/config.php   # y cambia la contraseña de Juniors
#   sudo chmod -R a+rX .                                 # el contenedor debe poder leer
#   sudo chown -R 33:33 data && sudo chmod -R 775 data   # 33 = www-data del contenedor
#
# Para actualizar la web: subir-a-raspberry.bat (nunca scp -r de la carpeta
# entera: machacaría data/ y config.php). Cambios en .php/.css/.js no
# requieren reinicio (la carpeta va montada).
#
# Acceso: Cloudflare Access delante (como el resto de webs). La sección
# Juniors pide además su propia contraseña (includes/config.php).
# ------------------------------------------------------------------

services:
  web-confirmacion:
    image: php:8.3-apache
    container_name: web-confirmacion
    restart: unless-stopped

    ports:
      - "8094:80"          # NPM / túnel: confirmacion.${DOMAIN} -> ${PI_HOST_IP}:8094

    volumes:
      - /mnt/hdd/webs/web-confirmacion:/var/www/html

    # Activa AllowOverride (para que el .htaccess bloquee /data y /includes
    # y suba el límite de archivos) y los módulos necesarios. Sin Dockerfile.
    command: >
      bash -c "sed -ri 's|AllowOverride None|AllowOverride All|g' /etc/apache2/apache2.conf &&
               a2enmod rewrite headers expires >/dev/null 2>&1;
               exec apache2-foreground"

    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1/login.php') === false ? 1 : 0);"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
