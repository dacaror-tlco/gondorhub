services:
  web-palantir:
    image: node:20-alpine
    container_name: web-palantir
    restart: unless-stopped
    working_dir: /app
    ports:
      - "8083:3000"
    volumes:
      - /mnt/hdd/webs/web-palantir/backend:/app
      - /mnt/hdd/webs/web-palantir:/site:ro
      - /mnt/hdd/webs/web-palantir-uploads:/app/uploads
      - "/mnt/hdd/webs/web-palantir/files/uploads dossier:/site/files/uploads dossier"
    command: sh -c "npm install --omit=dev && node server.js"
    environment:
      - PORT=3000
      - PUBLIC_DIR=/site
      - FUNCIONES_PIN=${PALANTIR_FUNCIONES_PIN}
