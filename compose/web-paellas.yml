services:
  web-paellas:
    image: node:22-alpine
    container_name: web-paellas
    restart: unless-stopped
    working_dir: /app
    ports:
      - "8089:3000"          # NPM: paellas.${DOMAIN} -> ${PI_HOST_IP}:8089
    volumes:
      - /mnt/hdd/webs/web-paellas:/app
    command: node server.js
    environment:
      - PORT=3000