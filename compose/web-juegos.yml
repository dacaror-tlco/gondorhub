services:
  web-juegos:
    image: nginx:1.27-alpine
    container_name: web-juegos
    restart: unless-stopped
    ports:
      - "8095:80"          # NPM: juegos.${DOMAIN} -> ${PI_HOST_IP}:8095
    volumes:
      - /mnt/hdd/webs/web-juegos:/usr/share/nginx/html:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
